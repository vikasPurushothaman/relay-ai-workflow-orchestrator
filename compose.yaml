name: relay
services:
  mysql:
    image: mysql:8.4.11@sha256:0744ee5ef89ce6ccfa13de3e579fe6b9e27f93dd70da9c06d2c908b1b193fb8d
    environment:
      MYSQL_DATABASE: relay
      MYSQL_USER: relay
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    secrets:
      - mysql_password
      - mysql_root_password
    ports:
      - "127.0.0.1:${RELAY_MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$(cat /run/secrets/mysql_password) mysql --protocol=TCP -h 127.0.0.1 -u relay --database=relay --connect-timeout=3 --execute='SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s
    stop_grace_period: 30s
volumes:
  mysql_data:
secrets:
  mysql_password:
    file: ${RELAY_MYSQL_SECRET_DIR:-./local-data/mysql}/password
  mysql_root_password:
    file: ${RELAY_MYSQL_SECRET_DIR:-./local-data/mysql}/root-password
